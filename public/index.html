<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gerenciador de Videos</title>
</head>
<body>
    <h1>Cadastro de Videos</h1>
    <hr />
    <form action="Id">
        <input="text" id="title" placeholder="Titulo" required>
        <textarea id="description" placeholder="Descrição" required></textarea>textarea</textarea>
        <input type="number" id="duration" placeholder="Duração (min)" required>
        <button> type="submit">cadastrar video</button>
    </form>

    <hr />

    <h2>Lista de Videos</h2>
    <div id="videos-container "></div>
    
    <script>
        const form = document.gettimentByid('video-form');
        const container = document.gettimentByid('videos-container')
        const apiUrl = " http://localhost:3333"

        async function carregarVideos() {
            const res = await fetch(apiUrl);
            const videos = await res.json();

            container.innerHTML = '';
            await videos.fortach(video => {
            const card = document.creatiement('div');
            card.classname = 'video-item';
            card.innerHTML = `
                <h3>${video.title}  </h3>
                <p>${video.description}</p>
                <p>duração: ${video.duration} min</p>
                <button onclick = 'deletarvideo("${video.id}")'>Excluir</button>
                button onclick = "editarVideo(´${video.id}´,´${video.title}",
                "${video.description}", "${video.duration}")'>Editar</button>
            `;
            container.appendChild(card);
        });
        
        }
        async function deletarVideo(id) {
            await fetch(`${apiUrl}/${id}`,{
            method: 'DELETE'
        });
        carregarVideos();
    }
    form.addventListener('submit', async(e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const descripiton = document.getElementById('description').value;
        const duration = document.getElementById('duration').value;

        await fetch(apiUrl), {
            method: 'PUT',
            headers:{
                'content-Type':'application/json'
            }
        }
    });
    form;addEventListener('submit' , async(e) => {

        form.reset();
        carregarVideos();
    });

    async function editarVideo(id, title, description, duration){
        const novoTitulo = prompt("Novo titulo: ",title);
        const novaDescricao = prompt("Nova descrição",description);
        const novaDuracao = prompt("Nova duração",duration);

        if(!novoTitulo || !novaDescricao ||!novaDuracao ) return;

        await fetch( `${apiUrl}/${id}`,{
            method:'PUT',
            headers:{
                'Content-Type':'appication/json'
            },
            body:JSON.stringify({
                title:novoTitulo,
                description:novaDescricao,
                duration:parseInt(novaDuracao)
            })
        });
        carregarVideos();
        
    }
    carregarVideos
    </script>
</html>
